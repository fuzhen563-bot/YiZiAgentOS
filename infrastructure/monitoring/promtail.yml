server:
  log_level: info

positions:
  filename: /var/log/agentos/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: agentos-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: agentos
          app: agentos
          type: application
          __path__: /var/log/agentos/app.log
  - job_name: agentos-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: agentos
          app: agentos
          type: audit
          __path__: /var/log/agentos/audit.log