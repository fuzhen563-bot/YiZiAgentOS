apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: agentos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-runtime
  template:
    metadata:
      labels:
        app: agent-runtime
    spec:
      containers:
        - name: agent-runtime
          image: ghcr.io/agentos/agentos/agent-runtime:latest
          ports:
            - containerPort: 9095
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9095
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9095
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  namespace: agentos
spec:
  selector:
    app: agent-runtime
  ports:
    - port: 80
      targetPort: 9095