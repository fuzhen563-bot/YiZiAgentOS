apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentos-isolation
  namespace: agentos
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: agentos-infra
        - namespaceSelector:
            matchLabels:
              name: agentos
      ports:
        - protocol: TCP
          port: 18088
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: agentos-infra
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 6333
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentos-infra-isolation
  namespace: agentos-infra
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: agentos
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: agentos