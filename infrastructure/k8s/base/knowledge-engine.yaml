apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-engine
  namespace: agentos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowledge-engine
  template:
    metadata:
      labels:
        app: knowledge-engine
    spec:
      containers:
        - name: knowledge-engine
          image: ghcr.io/agentos/agentos/knowledge-engine:latest
          ports:
            - containerPort: 9091
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: OPENAI_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9091
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-engine
  namespace: agentos
spec:
  selector:
    app: knowledge-engine
  ports:
    - port: 80
      targetPort: 9091