apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-gateway
  namespace: agentos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: model-gateway
    spec:
      containers:
        - name: model-gateway
          image: ghcr.io/agentos/agentos/model-gateway:latest
          ports:
            - containerPort: 9090
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: agentos-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: agentos-config
                  key: REDIS_PORT
          envFrom:
            - secretRef:
                name: model-gateway-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: model-gateway
  namespace: agentos
spec:
  selector:
    app: model-gateway
  ports:
    - port: 80
      targetPort: 9090
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: model-gateway-ingress
  namespace: agentos
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: gateway.agentos.example.com
      http:
        paths:
          - path: /api/v1/gateway
            pathType: Prefix
            backend:
              service:
                name: model-gateway
                port:
                  number: 80

---
apiVersion: v1
kind: Secret
metadata:
  name: model-gateway-secrets
  namespace: agentos
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  DASHSCOPE_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  JWT_SECRET: "CHANGE_ME"