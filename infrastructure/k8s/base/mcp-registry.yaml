apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-registry
  namespace: agentos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-registry
  template:
    metadata:
      labels:
        app: mcp-registry
    spec:
      containers:
        - name: mcp-registry
          image: ghcr.io/agentos/agentos/mcp-registry:latest
          ports:
            - containerPort: 9092
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-registry
  namespace: agentos
spec:
  selector:
    app: mcp-registry
  ports:
    - port: 80
      targetPort: 9092