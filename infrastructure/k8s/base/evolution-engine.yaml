apiVersion: apps/v1
kind: Deployment
metadata:
  name: evolution-engine
  namespace: agentos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evolution-engine
  template:
    metadata:
      labels:
        app: evolution-engine
    spec:
      containers:
        - name: evolution-engine
          image: ghcr.io/agentos/agentos/evolution-engine:latest
          ports:
            - containerPort: 9094
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9094
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9094
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: evolution-engine
  namespace: agentos
spec:
  selector:
    app: evolution-engine
  ports:
    - port: 80
      targetPort: 9094