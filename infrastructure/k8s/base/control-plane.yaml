apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: agentos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
        - name: control-plane
          image: ghcr.io/agentos/agentos/control-plane:latest
          ports:
            - containerPort: 9097
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
          livenessProbe:
            httpGet: { path: /actuator/health, port: 9097 }
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health, port: 9097 }
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: agentos
spec:
  selector:
    app: control-plane
  ports:
    - port: 80
      targetPort: 9097