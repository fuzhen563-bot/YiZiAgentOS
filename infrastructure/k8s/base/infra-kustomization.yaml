apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentos-infra

resources:
  - postgres.yaml
  - redis.yaml
  - minio.yaml
  - qdrant.yaml
  - loki.yaml
  - prometheus.yaml
  - grafana.yaml
  - jaeger.yaml
  - otel-collector.yaml

commonLabels:
  app.kubernetes.io/name: agentos-infra
  app.kubernetes.io/part-of: agentos