apiVersion: v1
kind: ConfigMap
metadata:
  name: agentos-config
  namespace: agentos
data:
  DATABASE_HOST: "postgres-postgresql.agentos-infra.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "agentos"
  DATABASE_USERNAME: "agentos"
  REDIS_HOST: "redis-master.agentos-infra.svc.cluster.local"
  REDIS_PORT: "6379"
  QDRANT_URL: "http://qdrant.agentos-infra.svc.cluster.local:6333"
  MINIO_ENDPOINT: "minio.agentos-infra.svc.cluster.local:9000"
  LOKI_URL: "http://loki.agentos-infra.svc.cluster.local:3100"
  PROMETHUS_URL: "http://prometheus.agentos-infra.svc.cluster.local:9090"

---
apiVersion: v1
kind: Secret
metadata:
  name: agentos-secrets
  namespace: agentos
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME"
  S3_ACCESS_KEY: "agentos"
  S3_SECRET_KEY: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME_AT_LEAST_32_CHARS"
  GRAFANA_PASSWORD: "admin123"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentos-data
  namespace: agentos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi