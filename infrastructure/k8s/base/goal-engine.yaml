apiVersion: apps/v1
kind: Deployment
metadata:
  name: goal-engine
  namespace: agentos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goal-engine
  template:
    metadata:
      labels:
        app: goal-engine
    spec:
      containers:
        - name: goal-engine
          image: ghcr.io/agentos/agentos/goal-engine:latest
          ports:
            - containerPort: 9096
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
          livenessProbe:
            httpGet: { path: /actuator/health, port: 9096 }
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health, port: 9096 }
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: goal-engine
  namespace: agentos
spec:
  selector:
    app: goal-engine
  ports:
    - port: 80
      targetPort: 9096