<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亦梓AgentOS · AI Agent Console</title>
<style>
:root {
  --bg: #0c0f15; --bg-2: #14181f; --bg-3: #1c212b; --bg-4: #252b36;
  --text: #e8edf5; --text-2: #94a3b8; --text-3: #5c6b7e;
  --accent: #d97757; --accent-hover: #e2876a; --accent-dim: rgba(217,119,87,0.12);
  --border: #252b36; --border-hover: #334155;
  --success: #22c55e; --warning: #eab308; --error: #ef4444;
  --radius: 10px; --radius-sm: 6px; --radius-lg: 14px;
  --font: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --mono: 'SF Mono','Fira Code','Cascadia Code',monospace;
  --shadow: 0 4px 24px rgba(0,0,0,.3);
}
[data-theme="light"] {
  --bg: #f5f0eb; --bg-2: #fffcf8; --bg-3: #f0ebe5; --bg-4: #e5dfd8;
  --text: #1e293b; --text-2: #64748b; --text-3: #94a3b8;
  --accent: #d97757; --accent-hover: #c46a4e; --accent-dim: rgba(217,119,87,0.08);
  --border: #e0d9d0; --border-hover: #c8c0b6;
  --shadow: 0 4px 24px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;transition:background .25s,color .25s}
.app{display:flex;height:100vh}

/* Sidebar */
.sidebar{width:270px;background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-head{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px}
.logo-img{width:34px;height:34px;border-radius:9px;object-fit:contain}
.logo-text{font-size:16px;font-weight:700;letter-spacing:-.3px}
.logo-sub{font-size:10px;color:var(--text-3);margin-top:0px;opacity:.7}
.sidebar-tabs{display:flex;padding:6px 10px 0;gap:2px}
.sidebar-tab{flex:1;padding:7px 4px;text-align:center;border:none;background:transparent;color:var(--text-2);font-size:11.5px;font-weight:500;cursor:pointer;border-radius:var(--radius-sm) var(--radius-sm) 0 0;transition:all .15s}
.sidebar-tab:hover{color:var(--text);background:var(--bg-3)}
.sidebar-tab.active{color:var(--accent);background:var(--bg);border-bottom:2px solid var(--accent)}
.sidebar-body{flex:1;overflow-y:auto;padding:8px}
.sidebar-body::-webkit-scrollbar{width:3px}
.sidebar-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.agent-section-title{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-3);padding:6px 10px 4px;font-weight:600}
.agent-card{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:all .12s;margin-bottom:1px;border:1px solid transparent}
.agent-card:hover{background:var(--bg-3)}
.agent-card.active{background:var(--accent-dim);border-color:var(--accent)}
.agent-av{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:#fff}
.agent-av.s1{background:linear-gradient(135deg,#d97757,#e2876a)}
.agent-av.s2{background:linear-gradient(135deg,#3b82f6,#60a5fa)}
.agent-av.s3{background:linear-gradient(135deg,#10b981,#34d399)}
.agent-av.s4{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}
.agent-av.s5{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.agent-info{flex:1;min-width:0}
.agent-name{font-size:12.5px;font-weight:600}
.agent-role{font-size:10px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.agent-dot.idle{background:var(--success)}
.agent-dot.busy{background:var(--warning);animation:pulse 1.2s infinite}

/* Settings */
.settings-panel{padding:8px}
.settings-panel h3{font-size:12px;margin-bottom:6px;color:var(--text-2);font-weight:600}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px}
.settings-row label{color:var(--text-2)}
.settings-row select,.settings-row input{padding:3px 7px;border-radius:4px;border:1px solid var(--border);background:var(--bg-4);color:var(--text);font-size:11.5px;outline:none}
.sidebar-foot{padding:10px 14px;border-top:1px solid var(--border);font-size:10.5px;color:var(--text-3);display:flex;justify-content:space-between;align-items:center}
.theme-btn{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 10px;color:var(--text-2);cursor:pointer;font-size:13px;transition:all .12s;line-height:1}
.theme-btn:hover{border-color:var(--accent)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:0 18px;height:48px;border-bottom:1px solid var(--border);background:var(--bg-2);flex-shrink:0}
.topbar-title{font-weight:600;font-size:14px}
.topbar-agent{font-size:11px;color:var(--text-3);padding:3px 10px;border-radius:12px;background:var(--accent-dim);border:1px solid transparent}
.topbar-actions{margin-left:auto;display:flex;gap:6px}
.topbar-btn{padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-3);color:var(--text-2);font-size:11.5px;cursor:pointer;transition:all .12s}
.topbar-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Chat */
.chat{flex:1;overflow-y:auto;padding:16px 20px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* Welcome */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:20px}
.welcome-ic{width:56px;height:56px;border-radius:50%;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px}
.welcome h2{font-size:18px;font-weight:700;margin-bottom:4px}
.welcome p{color:var(--text-2);font-size:13px;max-width:380px;line-height:1.7;margin-bottom:4px}
.welcome-tips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.welcome-tip{padding:4px 12px;border-radius:14px;background:var(--bg-3);border:1px solid var(--border);color:var(--text-2);font-size:11px;cursor:pointer;transition:all .12s}
.welcome-tip:hover{border-color:var(--accent);color:var(--accent)}

/* Messages */
.msg{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse;margin-left:auto}
.msg-av{width:28px;height:28px;border-radius:7px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.msg-av.user-av{background:var(--accent);color:#fff}
.msg-av.asst-av{background:var(--bg-4);color:var(--text-2)}
.msg-body{max-width:75%;min-width:0}
.msg-bubble{padding:10px 16px;line-height:1.7;word-break:break-word}
.msg-bubble.user{background:var(--accent);color:#fff;border-radius:14px 14px 4px 14px;font-size:13.5px}
.msg-bubble.asst{background:transparent;border:none;padding:4px 0;font-size:13.5px;color:var(--text)}
.msg-bubble.asst .content p{margin:3px 0}
.msg-bubble.asst .content code{background:var(--bg-3);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px}
.msg-bubble.asst .content ul,.msg-bubble.asst .content ol{padding-left:18px;margin:4px 0}
.msg-bubble.asst .content li{margin:2px 0}
.msg-bubble.asst .content hr{border:none;border-top:1px solid var(--border);margin:8px 0}
.msg-info{display:flex;align-items:center;gap:6px;padding:2px 4px 0}
.msg-time{font-size:9.5px;color:var(--text-3)}
.msg-agent-tag{font-size:9px;padding:1px 6px;border-radius:8px;background:var(--accent-dim);color:var(--accent)}

/* Thinking */
.think-card{margin:2px 0;border-radius:var(--radius-sm);overflow:hidden}
.think-header{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--accent-dim);border:1px solid var(--accent);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;font-family:inherit;font-size:11px;color:var(--text);width:100%}
.think-header:hover{background:rgba(217,119,87,0.18)}
.think-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}
.think-label{font-weight:600;font-size:11px;flex:1;text-align:left}
.think-arrow{font-size:8px;transition:transform .2s}
.think-arrow.open{transform:rotate(180deg)}
.think-body{padding:5px 12px 3px;border-left:2px solid var(--accent);margin:0 0 2px 12px;font-size:12px;color:var(--text-2);line-height:1.6;white-space:pre-wrap;display:none}
.think-body.open{display:block}

/* Tool calls */
.tool-card{display:flex;align-items:center;gap:6px;padding:4px 8px;margin:2px 0;border-radius:var(--radius-sm);background:var(--bg-3);border:1px solid var(--border);font-size:11px}
.tool-ic{width:16px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:8px}
.tool-ic.ok{background:rgba(34,197,94,0.15);color:var(--success)}
.tool-name{font-weight:600;flex:1}

/* Input */
.input-area{padding:10px 18px 14px;border-top:1px solid var(--border);background:var(--bg-2)}
.input-wrap{display:flex;gap:8px;align-items:flex-end;background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius);padding:4px;transition:border-color .15s}
.input-wrap:focus-within{border-color:var(--accent)}
.input-wrap textarea{flex:1;padding:5px 10px;border:none;background:transparent;color:var(--text);font-size:13.5px;outline:none;font-family:var(--font);resize:none;min-height:20px;max-height:100px;line-height:1.5}
.input-wrap textarea::placeholder{color:var(--text-3)}
.input-wrap button{padding:6px 16px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .12s;white-space:nowrap}
.input-wrap button:hover{background:var(--accent-hover)}
.input-wrap button:disabled{opacity:.4;cursor:not-allowed}

/* Typing */
.typing-dots{display:flex;gap:3px;padding:4px 0}
.typing-dots span{width:5px;height:5px;background:var(--text-3);border-radius:50%;animation:typing 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* Service bar */
.svc-bar{display:flex;align-items:center;gap:8px;padding:4px 18px;background:var(--bg);border-top:1px solid var(--border);font-size:10px;color:var(--text-3);flex-shrink:0;overflow-x:auto;white-space:nowrap}
.svc-item{display:flex;align-items:center;gap:3px}
.svc-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.svc-dot.green{background:var(--success)}
.svc-dot.yellow{background:var(--warning);animation:pulse 1s infinite}
.svc-dot.red{background:var(--error)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
@media(max-width:768px){.sidebar{display:none}}
</style>
</head>
<body>
<div class="app">

<aside class="sidebar">
  <div class="sidebar-head">
    <div class="logo">
      <img src="logo.png" alt="" class="logo-img" onerror="this.style.display='none'">
      <div><div class="logo-text">亦梓AgentOS</div><div class="logo-sub">AI Agent Operating System</div></div>
    </div>
  </div>
  <div class="sidebar-tabs">
    <button class="sidebar-tab active" data-tab="agents" onclick="switchTab('agents')">Agents</button>
    <button class="sidebar-tab" data-tab="tools" onclick="switchTab('tools')">Tools</button>
    <button class="sidebar-tab" data-tab="settings" onclick="switchTab('settings')">Settings</button>
  </div>
  <div class="sidebar-body">
    <div id="panel-agents" class="tab-panel"></div>
    <div id="panel-tools" class="tab-panel" style="display:none;padding:8px"><div class="agent-section-title">Available Tools</div><div id="toolList" style="font-size:12px;color:var(--text-2)">Loading...</div></div>
    <div id="panel-settings" class="tab-panel" style="display:none">
      <div class="settings-panel">
        <h3>LLM</h3>
        <div class="settings-row"><label>Endpoint</label><input id="s-api" style="width:140px;font-size:10px"></div>
        <div class="settings-row"><label>Model</label><input id="s-model" style="width:140px"></div>
        <div class="settings-row"><label>API Key</label><input id="s-key" type="password" style="width:140px;font-family:var(--mono);font-size:10px"></div>
        <h3 style="margin-top:12px">Agent</h3>
        <div class="settings-row"><label>Default</label><select id="s-mode"><option value="route">Auto Route</option><option value="agent-1">SalesBot</option><option value="agent-2">HRBot</option><option value="agent-3">FinanceBot</option><option value="agent-4">LegalBot</option><option value="agent-5">SupportBot</option></select></div>
        <div style="margin-top:12px;display:flex;gap:6px"><button class="topbar-btn" onclick="saveSettings()" style="flex:1;text-align:center">Save</button><button class="topbar-btn" onclick="clearChat()" style="flex:1;text-align:center">Clear</button></div>
      </div>
    </div>
  </div>
  <div class="sidebar-foot">
    <span id="svcSummary">--</span>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="topbar-title">亦梓AgentOS</div>
    <span class="topbar-agent" id="activeAgent">Auto Route</span>
    <div class="topbar-actions"><button class="topbar-btn" onclick="location='admin/index.html'">Admin</button><button class="topbar-btn" onclick="clearChat()">✕ Clear</button></div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
  <div class="svc-bar" id="svcBar"></div>
</main>
</div>

<script>
const S = { busy:false, convId:Date.now().toString(), msgs:0,
  agents: {
    'agent-1':{n:'SalesBot',r:'Sales Representative',c:'s1'},
    'agent-2':{n:'HRBot',r:'HR Assistant',c:'s2'},
    'agent-3':{n:'FinanceBot',r:'Financial Analyst',c:'s3'},
    'agent-4':{n:'LegalBot',r:'Legal Counsel',c:'s4'},
    'agent-5':{n:'SupportBot',r:'Customer Support',c:'s5'}
  }
};

function init(){loadTheme();loadSettings();renderAgents();renderWelcome();fetchTools();fetchSV();setInterval(fetchSV,15e3);inp().focus()}
function inp(){return document.getElementById('input')}

// Theme
function toggleTheme(){const h=document.documentElement;const b=document.getElementById('themeBtn');if(h.getAttribute('data-theme')==='light'){h.removeAttribute('data-theme');b.textContent='🌙';localStorage.setItem('aios-theme','dark')}else{h.setAttribute('data-theme','light');b.textContent='☀️';localStorage.setItem('aios-theme','light')}}
function loadTheme(){if(localStorage.getItem('aios-theme')==='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('themeBtn').textContent='☀️'}}

// Tabs
function switchTab(n){document.querySelectorAll('.sidebar-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===n));document.querySelectorAll('.tab-panel').forEach(p=>p.style.display='none');document.getElementById('panel-'+n).style.display='block';if(n==='tools')fetchTools()}

// Agents
function renderAgents(){const p=document.getElementById('panel-agents');p.innerHTML='<div class="agent-section-title">Digital Employees</div>';Object.entries(S.agents).forEach(([id,a]) => {const c=document.createElement('div');c.className='agent-card';c.id='c'+id;c.innerHTML=`<div class="agent-av ${a.c}">${a.n[0]}</div><div class="agent-info"><div class="agent-name">${a.n}</div><div class="agent-role">${a.r}</div></div><span class="agent-dot idle" id="d${id}"></span>`;c.onclick=()=>{document.getElementById('s-mode').value=id;selAgent(id);inp().focus()};p.appendChild(c)})}
function selAgent(id){document.querySelectorAll('.agent-card').forEach(c=>c.classList.remove('active'));const c=document.getElementById('c'+id);if(c)c.classList.add('active');const a=S.agents[id];document.getElementById('activeAgent').textContent=a?a.n:'Auto Route'}

// Welcome
function renderWelcome(){document.getElementById('chat').innerHTML=`<div class="welcome"><div class="welcome-ic">🤖</div><h2>有什么可以帮助你的？</h2><p>我是亦梓AgentOS，可以帮你处理销售、人事、财务、法务、技术支持等任务，还可以访问 GitHub、邮件、日历、CRM 和 ERP 工具。</p><div class="welcome-tips"><span class="welcome-tip" onclick="qa('查看我的日历事件')">📅 日历</span><span class="welcome-tip" onclick="qa('列出我的 GitHub 仓库')">📦 GitHub</span><span class="welcome-tip" onclick="qa('查看我的邮件')">✉️ 邮件</span><span class="welcome-tip" onclick="qa('显示 CRM 联系人')">👥 CRM</span><span class="welcome-tip" onclick="qa('查看库存')">📊 库存</span></div></div>`}

// Tools
async function fetchTools(){const e=document.getElementById('toolList');try{const r=await fetch('http://localhost:9092/api/v1/mcp/tools',{signal:AbortSignal.timeout(4e3)});const t=await r.json();e.innerHTML=t.map(x=>`<div class="tool-card" style="margin:2px 0"><span class="tool-ic ok">✓</span><span class="tool-name">${esc(x.name)}</span><span style="color:var(--text-3);font-size:9.5px"> ${esc(x.provider||'')}</span></div>`).join('')}catch{e.textContent='MCP not available (9092)'}}

// Services
let svcCache={},svcTime=0;async function fetchSV(){const n=Date.now();if(n-svcTime<5e3&&Object.keys(svcCache).length){renderSvc(svcCache);return}const p={9090:'MG',9091:'KE',9092:'MCP',9093:'SE',9094:'EE',9095:'AR',9096:'GL',9097:'CP'};const r={};await Promise.all(Object.entries(p).map(async([o,n])=>{try{await fetch('http://localhost:'+o+'/actuator/health',{signal:AbortSignal.timeout(2e3)});r[o]='green'}catch{r[o]='yellow'}}));svcCache=r;svcTime=n;renderSvc(r)}
function renderSvc(r){const b=document.getElementById('svcBar');let u=0,t=Object.keys(r).length;b.innerHTML=Object.entries(r).map(([o,c])=>{if(c==='green')u++;return`<span class="svc-item"><span class="svc-dot ${c}"></span>${({9090:'MG',9091:'KE',9092:'MCP',9093:'SE',9094:'EE',9095:'AR',9096:'GL',9097:'CP'})[o]}</span>`}).join('');document.getElementById('svcSummary').textContent=u+'/'+t+' up'}

// Messages
function addMsg(role,text,meta){const w=document.querySelector('.welcome');if(w)w.remove();const chat=document.getElementById('chat');const d=document.createElement('div');d.className='msg '+role;const init=role==='user'?'你':(meta?.aid&&S.agents[meta.aid]?S.agents[meta.aid].n[0]:'A');let ext='';if(meta?.th){ext+=`<div class="think-card"><div class="think-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.think-arrow').classList.toggle('open')"><span class="think-dot"></span><span class="think-label">思考过程</span><span class="think-arrow">▼</span></div><div class="think-body">${esc(meta.th)}</div></div>`}
if(meta?.tc?.length){meta.tc.forEach(x=>{ext+=`<div class="tool-card"><span class="tool-ic ok">✓</span><span class="tool-name">${esc(x.toolName)}</span></div>`})}
const ag=role==='assistant'&&meta?.aid&&S.agents[meta.aid]?S.agents[meta.aid].n:'';
d.innerHTML=`<div class="msg-av ${role==='user'?'user-av':'asst-av'}">${init}</div><div class="msg-body">${ext}<div class="msg-bubble ${role}"><div class="content">${role==='user'?esc(text):renderMD(text)}</div></div><div class="msg-info">${ag?`<span class="msg-agent-tag">${ag}</span>`:''}<span class="msg-time">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div></div>`;
if(role==='user'){const a=d.querySelector('.msg-av'),b=d.querySelector('.msg-body');d.insertBefore(b,a)}
chat.appendChild(d);chat.scrollTop=chat.scrollHeight;S.msgs++}

function renderMD(t){if(!t)return '';let h=esc(t).replace(/### (.+)/g,'<b>$1</b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');return '<p>'+h+'</p>'}
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}

function addTyping(){const w=document.querySelector('.welcome');if(w)w.remove();const c=document.getElementById('chat');const d=document.createElement('div');d.className='msg asst';d.id='_typing';d.innerHTML='<div class="msg-av asst-av">A</div><div class="msg-body"><div class="typing-dots"><span></span><span></span><span></span></div></div>';c.appendChild(d);c.scrollTop=c.scrollHeight}
function rmTyping(){const t=document.getElementById('_typing');if(t)t.remove()}
function qa(t){inp().value=t;send()}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px'}

async function send(){if(S.busy)return;const i=inp();const t=i.value.trim();if(!t)return;i.value='';i.style.height='auto';S.busy=true;document.getElementById('sendBtn').disabled=true
addMsg('user',t);addTyping();const mode=document.getElementById('s-mode').value
try{const url=mode==='route'?'http://localhost:9095/api/v1/runtime/route':'http://localhost:9095/api/v1/runtime/agents/'+mode+'/execute'
const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,userId:'webui',conversationId:S.convId})})
const d=await r.json();rmTyping();const m={};if(d.thoughts?.length)m.th=d.thoughts.join('\n');if(d.toolCalls?.length)m.tc=d.toolCalls;m.aid=d.agentId||(mode!=='route'?mode:null)
addMsg('assistant',d.message||'(empty)',m)}catch(e){rmTyping();addMsg('assistant','⚠️ 连接失败，请确认 Agent Runtime (9095) 已启动',{})}
S.busy=false;document.getElementById('sendBtn').disabled=false;inp().focus()}

function loadSettings(){try{const s=JSON.parse(localStorage.getItem('aios-settings')||'{}');document.getElementById('s-api').value=s.api||'https://api.yiziyun.com/v1/chat/completions';document.getElementById('s-model').value=s.model||'deepseek-v4-flash';document.getElementById('s-key').value=s.key||'sk-2igVg3QbH8AOHVjuixJR7uDGTUwimoZ1BSjCNwYFTe3toLFa';document.getElementById('s-mode').value=s.mode||'route'}catch{}}
function saveSettings(){const s={api:document.getElementById('s-api').value,model:document.getElementById('s-model').value,mode:document.getElementById('s-mode').value,key:document.getElementById('s-key').value};localStorage.setItem('aios-settings',JSON.stringify(s));const m=document.getElementById('s-mode').value;document.getElementById('activeAgent').textContent=(m!=='route'&&S.agents[m])?S.agents[m].n:'Auto Route'}
function clearChat(){document.getElementById('chat').innerHTML='';renderWelcome()}

init();
</script>
</body>
</html>
